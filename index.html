<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>読書管理アプリ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    h2 {
      margin-top: 0;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .counter {
      text-align: right;
      font-size: 13px;
      color: #666;
      margin-top: 4px;
    }

    button {
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 15px;
      cursor: pointer;
    }

    .primary-button {
      background: #333;
      color: #fff;
    }

    .delete-button {
      background: #e74c3c;
      color: white;
    }

    .edit-button {
      background: #ddd;
      color: #222;
    }

    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filters select {
      width: auto;
      min-width: 160px;
    }

    .book-list {
      display: grid;
      gap: 14px;
    }

    .book-item {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
    }

    .book-header {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: flex-start;
    }

    .book-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 13px;
      background: #eee;
      margin-bottom: 10px;
    }

    .book-info {
      margin: 5px 0;
      line-height: 1.6;
    }

    .note {
      white-space: pre-wrap;
      background: #f7f7f7;
      padding: 10px;
      border-radius: 6px;
      margin-top: 10px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 30px 0;
    }

    @media (max-width: 600px) {
      .book-header {
        display: block;
      }

      .filters {
        display: block;
      }

      .filters select {
        width: 100%;
        margin-bottom: 8px;
      }

      button {
        width: 100%;
      }

      .actions {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>読書管理</h1>

    <section class="card">
      <h2>本を登録</h2>

      <form id="bookForm">

        <input type="hidden" id="editId" />

        <div class="form-group">
          <label for="title">本のタイトル</label>
          <input
            type="text"
            id="title"
            placeholder="例：吾輩は猫である"
            required
          />
        </div>

        <div class="form-group">
          <label for="status">状態</label>
          <select id="status">
            <option value="want">読みたい本</option>
            <option value="read">読んだ本</option>
          </select>
        </div>

        <div class="form-group">
          <label for="startDate">読書開始日</label>
          <input type="date" id="startDate" />
        </div>

        <div class="form-group">
          <label for="endDate">読書終了日</label>
          <input type="date" id="endDate" />
        </div>

        <div class="form-group">
          <label for="note">備考・感想（100字以内）</label>

          <textarea
            id="note"
            maxlength="100"
            placeholder="本の感想などを100字以内で入力"
          ></textarea>

          <div class="counter">
            <span id="noteCount">0</span> / 100文字
          </div>
        </div>

        <button class="primary-button" type="submit">
          保存
        </button>

      </form>
    </section>

    <section class="card">

      <h2>本の一覧</h2>

      <div class="filters">

        <select id="statusFilter">
          <option value="all">すべて</option>
          <option value="want">読みたい本</option>
          <option value="read">読んだ本</option>
        </select>

        <select id="yearFilter">
          <option value="all">すべての年</option>
        </select>

      </div>

      <div id="bookList" class="book-list"></div>

    </section>

  </div>

  <script>
    const STORAGE_KEY = "readingBooks";

    const bookForm = document.getElementById("bookForm");
    const titleInput = document.getElementById("title");
    const statusInput = document.getElementById("status");
    const startDateInput = document.getElementById("startDate");
    const endDateInput = document.getElementById("endDate");
    const noteInput = document.getElementById("note");
    const noteCount = document.getElementById("noteCount");

    const editIdInput = document.getElementById("editId");

    const bookList = document.getElementById("bookList");
    const statusFilter = document.getElementById("statusFilter");
    const yearFilter = document.getElementById("yearFilter");

    let books = loadBooks();

    function loadBooks() {
      const data = localStorage.getItem(STORAGE_KEY);

      if (!data) {
        return [];
      }

      try {
        return JSON.parse(data);
      } catch {
        return [];
      }
    }

    function saveBooks() {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(books)
      );
    }

    noteInput.addEventListener("input", () => {
      noteCount.textContent = noteInput.value.length;
    });

    bookForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const title = titleInput.value.trim();
      const status = statusInput.value;
      const startDate = startDateInput.value;
      const endDate = endDateInput.value;
      const note = noteInput.value.trim();
      const editId = editIdInput.value;

      if (!title) {
        alert("本のタイトルを入力してください。");
        return;
      }

      if (
        startDate &&
        endDate &&
        startDate > endDate
      ) {
        alert(
          "読書終了日は読書開始日以降の日付を指定してください。"
        );
        return;
      }

      if (note.length > 100) {
        alert("感想は100文字以内で入力してください。");
        return;
      }

      if (editId) {

        const index = books.findIndex(
          (book) => book.id === editId
        );

        if (index !== -1) {
          books[index] = {
            ...books[index],
            title,
            status,
            startDate,
            endDate,
            note
          };
        }

      } else {

        const book = {
          id:
            Date.now().toString() +
            Math.random().toString(16).slice(2),
          title,
          status,
          startDate,
          endDate,
          note,
          createdAt: new Date().toISOString()
        };

        books.push(book);
      }

      saveBooks();

      resetForm();

      updateYearFilter();
      renderBooks();
    });

    statusFilter.addEventListener(
      "change",
      renderBooks
    );

    yearFilter.addEventListener(
      "change",
      renderBooks
    );

    function resetForm() {
      bookForm.reset();
      editIdInput.value = "";
      noteCount.textContent = "0";
    }

    function updateYearFilter() {

      const selectedYear =
        yearFilter.value;

      const years = [
        ...new Set(
          books
            .filter(
              (book) =>
                book.status === "read" &&
                book.endDate
            )
            .map(
              (book) =>
                new Date(
                  book.endDate
                ).getFullYear()
            )
        )
      ].sort((a, b) => b - a);

      yearFilter.innerHTML =
        '<option value="all">すべての年</option>';

      years.forEach((year) => {

        const option =
          document.createElement("option");

        option.value = year;
        option.textContent = `${year}年`;

        yearFilter.appendChild(option);

      });

      if (
        [...yearFilter.options].some(
          (option) =>
            option.value === selectedYear
        )
      ) {
        yearFilter.value =
          selectedYear;
      }
    }

    function renderBooks() {

      bookList.innerHTML = "";

      const selectedStatus =
        statusFilter.value;

      const selectedYear =
        yearFilter.value;

      let filteredBooks =
        books.filter((book) => {

          if (
            selectedStatus !== "all" &&
            book.status !== selectedStatus
          ) {
            return false;
          }

          if (selectedYear !== "all") {

            if (
              book.status !== "read" ||
              !book.endDate
            ) {
              return false;
            }

            const year =
              new Date(
                book.endDate
              ).getFullYear();

            if (
              String(year) !==
              selectedYear
            ) {
              return false;
            }
          }

          return true;
        });

      filteredBooks.sort(
        (a, b) => {

          const dateA =
            a.endDate ||
            a.startDate ||
            a.createdAt;

          const dateB =
            b.endDate ||
            b.startDate ||
            b.createdAt;

          return (
            new Date(dateB) -
            new Date(dateA)
          );
        }
      );

      if (
        filteredBooks.length === 0
      ) {

        bookList.innerHTML =
          '<div class="empty">登録された本はありません。</div>';

        return;
      }

      filteredBooks.forEach(
        (book) => {

          const item =
            document.createElement("div");

          item.className =
            "book-item";

          const statusText =
            book.status === "read"
              ? "読んだ本"
              : "読みたい本";

          item.innerHTML = `
            <div class="book-header">

              <div>

                <div class="book-title">
                  ${escapeHtml(book.title)}
                </div>

                <div class="status">
                  ${statusText}
                </div>

              </div>

            </div>

            <div class="book-info">
              <strong>読書開始日：</strong>
              ${formatDate(book.startDate)}
            </div>

            <div class="book-info">
              <strong>読書終了日：</strong>
              ${formatDate(book.endDate)}
            </div>

            ${
              book.note
                ? `
                <div class="note">
                  <strong>備考・感想</strong><br>
                  ${escapeHtml(book.note)}
                </div>
              `
                : ""
            }

            <div class="actions">

              <button
                class="edit-button"
                onclick="editBook('${book.id}')"
              >
                編集
              </button>

              <button
                class="delete-button"
                onclick="deleteBook('${book.id}')"
              >
                削除
              </button>

            </div>
          `;

          bookList.appendChild(item);

        });
    }

    function editBook(id) {

      const book =
        books.find(
          (book) => book.id === id
        );

      if (!book) {
        return;
      }

      editIdInput.value =
        book.id;

      titleInput.value =
        book.title;

      statusInput.value =
        book.status;

      startDateInput.value =
        book.startDate || "";

      endDateInput.value =
        book.endDate || "";

      noteInput.value =
        book.note || "";

      noteCount.textContent =
        noteInput.value.length;

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    function deleteBook(id) {

      const result =
        confirm(
          "この本を削除しますか？"
        );

      if (!result) {
        return;
      }

      books =
        books.filter(
          (book) => book.id !== id
        );

      saveBooks();

      updateYearFilter();
      renderBooks();
    }

    function formatDate(date) {

      if (!date) {
        return "未設定";
      }

      const [year, month, day] =
        date.split("-");

      return `${year}/${month}/${day}`;
    }

    function escapeHtml(text) {

      const div =
        document.createElement("div");

      div.textContent = text;

      return div.innerHTML;
    }

    updateYearFilter();
    renderBooks();
  </script>

</body>
</html>
