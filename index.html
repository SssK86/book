<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>わたしの本棚</title>

  <!-- Supabase JavaScript SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f5efe6;
      --paper: #fffdf8;
      --text: #332b26;
      --sub-text: #7a6f67;
      --accent: #7b4f34;
      --accent-dark: #5f3b27;
      --wood-dark: #62402c;
      --border: #ded2c5;
      --shadow: 0 6px 18px rgba(66, 45, 30, 0.12);
    }

    body {
      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

      background:
        radial-gradient(
          circle at top,
          #fffaf2 0,
          transparent 420px
        ),
        var(--bg);

      color: var(--text);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .container {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 36px 0 70px;
    }

    .app-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .app-title {
      margin: 0;

      font-size: clamp(30px, 5vw, 48px);

      letter-spacing: 0.08em;

      font-family:
        Georgia,
        "Yu Mincho",
        "Hiragino Mincho ProN",
        serif;
    }

    .app-subtitle {
      margin-top: 10px;
      color: var(--sub-text);
      font-size: 14px;
    }

    .panel {
      background: rgba(255, 253, 248, 0.94);

      border: 1px solid var(--border);

      border-radius: 18px;

      box-shadow: var(--shadow);

      padding: 22px;

      margin-bottom: 24px;
    }

    .panel-title {
      margin: 0 0 18px;
      font-size: 20px;
    }

    /* ==============================
       ログイン
    ============================== */

    .login-container {
      max-width: 460px;
      margin: 70px auto;
    }

    .login-description {
      color: var(--sub-text);
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 22px;
    }

    .login-step-title {
      margin-bottom: 8px;
      font-weight: bold;
    }

    .login-hint {
      color: var(--sub-text);
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    .login-link {
      color: var(--accent);
      text-decoration: underline;
      cursor: pointer;
      font-size: 13px;
      margin-top: 15px;
      display: inline-block;
    }

    /* ==============================
       フォーム
    ============================== */

    .form-grid {
      display: grid;
      grid-template-columns: 1.6fr 1fr 1fr;
      gap: 16px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 7px;

      font-size: 14px;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;

      border: 1px solid var(--border);

      border-radius: 10px;

      background: #fff;

      color: var(--text);

      padding: 11px 12px;

      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent);

      box-shadow:
        0 0 0 3px rgba(123, 79, 52, 0.1);
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .counter {
      margin-top: 5px;

      text-align: right;

      color: var(--sub-text);

      font-size: 12px;
    }

    /* ==============================
       ボタン
    ============================== */

    .primary-button,
    .secondary-button,
    .logout-button,
    .edit-button,
    .delete-button {
      border: 0;

      border-radius: 9px;

      padding: 10px 16px;
    }

    .primary-button {
      background: var(--accent);

      color: white;

      font-weight: bold;
    }

    .primary-button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .login-button {
      width: 100%;
    }

    .secondary-button {
      display: none;

      background: #ddd2c7;

      color: var(--text);
    }

    .logout-button {
      background: #ddd2c7;

      color: var(--text);
    }

    .form-actions,
    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .header-actions {
      margin-bottom: 16px;
    }

    .user-info {
      margin-right: auto;

      color: var(--sub-text);

      font-size: 13px;
    }

    /* ==============================
       メッセージ
    ============================== */

    .message {
      margin-top: 14px;

      padding: 11px 13px;

      border-radius: 8px;

      font-size: 13px;

      display: none;

      line-height: 1.6;
    }

    .message.error {
      display: block;

      background: #fbe6e6;

      color: #872f2f;
    }

    .message.success {
      display: block;

      background: #e8f2e8;

      color: #315f31;
    }

    /* ==============================
       タブ
    ============================== */

    .tabs {
      display: flex;

      gap: 8px;

      padding: 6px;

      border-radius: 14px;

      background: #e7ddd2;

      margin-bottom: 22px;
    }

    .tab-button {
      flex: 1;

      border: none;

      background: transparent;

      color: var(--sub-text);

      border-radius: 10px;

      padding: 12px 14px;

      font-weight: bold;
    }

    .tab-button.active {
      background: var(--paper);

      color: var(--accent-dark);

      box-shadow:
        0 2px 8px rgba(58, 38, 24, 0.08);
    }

    /* ==============================
       集計
    ============================== */

    .summary {
      display: flex;

      gap: 12px;

      flex-wrap: wrap;

      margin-bottom: 16px;
    }

    .summary-card {
      min-width: 150px;

      padding: 13px 16px;

      border: 1px solid var(--border);

      background: rgba(255,255,255,0.65);

      border-radius: 12px;
    }

    .summary-label {
      color: var(--sub-text);

      font-size: 12px;
    }

    .summary-number {
      margin-top: 2px;

      font-size: 24px;

      font-weight: bold;
    }

    /* ==============================
       ツールバー
    ============================== */

    .toolbar {
      display: flex;

      justify-content: space-between;

      gap: 12px;

      align-items: center;

      margin-bottom: 18px;
    }

    .tab-description {
      color: var(--sub-text);

      font-size: 14px;
    }

    .year-filter {
      width: 160px;
    }

    /* ==============================
       本棚
    ============================== */

    .bookshelf {
      position: relative;

      padding: 24px 22px 42px;

      border-radius: 14px;

      overflow: hidden;

      background:
        linear-gradient(
          90deg,
          rgba(104,67,43,0.08) 1px,
          transparent 1px
        ),
        linear-gradient(
          180deg,
          #d1a47d,
          #b67f58
        );

      background-size:
        40px 100%,
        100% 100%;

      border:
        8px solid var(--wood-dark);

      box-shadow:
        inset 0 0 20px rgba(68,38,20,0.22),
        0 8px 18px rgba(61,39,26,0.14);
    }

    .bookshelf::before,
    .bookshelf::after {
      content: "";

      position: absolute;

      left: 0;

      width: 100%;

      height: 16px;

      background:
        linear-gradient(
          180deg,
          #9d6846,
          var(--wood-dark)
        );
    }

    .bookshelf::before {
      top: 0;
    }

    .bookshelf::after {
      bottom: 0;
    }

    .book-grid {
      min-height: 220px;

      display: grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(130px, 1fr)
        );

      gap: 28px 18px;

      align-items: end;
    }

    .book {
      min-height: 210px;

      padding: 17px 12px 14px;

      border-radius: 5px 9px 9px 5px;

      color: white;

      display: flex;

      flex-direction: column;

      justify-content: space-between;

      box-shadow:
        4px 5px 9px rgba(49,31,19,0.32),
        inset -5px 0 0 rgba(0,0,0,0.08);
    }

    .book:nth-child(6n + 1) {
      background: #6e4a36;
    }

    .book:nth-child(6n + 2) {
      background: #47605c;
    }

    .book:nth-child(6n + 3) {
      background: #765d3e;
    }

    .book:nth-child(6n + 4) {
      background: #5d536b;
    }

    .book:nth-child(6n + 5) {
      background: #7a4b4b;
    }

    .book:nth-child(6n + 6) {
      background: #4f6175;
    }

    .book-title {
      font-family:
        Georgia,
        "Yu Mincho",
        serif;

      font-weight: bold;

      line-height: 1.45;

      word-break: break-word;
    }

    .book-status-label,
    .book-dates,
    .book-note {
      font-size: 11px;
    }

    .book-status-label {
      margin-top: 12px;

      opacity: 0.8;
    }

    .book-dates {
      margin-top: 12px;

      line-height: 1.6;
    }

    .book-note {
      margin-top: 10px;

      border-top:
        1px solid rgba(255,255,255,0.18);

      padding-top: 8px;

      line-height: 1.5;
    }

    .book-actions {
      display: flex;

      gap: 6px;

      margin-top: 13px;
    }

    .edit-button,
    .delete-button {
      flex: 1;

      padding: 7px 5px;

      font-size: 11px;
    }

    .edit-button {
      background:
        rgba(255,255,255,0.88);

      color: #40352e;
    }

    .delete-button {
      background:
        rgba(78,21,21,0.72);

      color: white;
    }

    .empty-state,
    .loading-state {
      grid-column: 1 / -1;

      min-height: 180px;

      display: flex;

      justify-content: center;

      align-items: center;

      text-align: center;

      color: #5c4636;

      background:
        rgba(255,248,237,0.38);

      border:
        1px dashed rgba(92,70,54,0.35);

      border-radius: 10px;
    }

    @media (max-width: 720px) {

      .container {
        width: calc(100% - 20px);
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }

      .book-grid {
        grid-template-columns:
          repeat(2, minmax(0,1fr));
      }

      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .year-filter {
        width: 100%;
      }

    }

  </style>
</head>


<body>

  <!-- ==========================================
       ログイン画面
  =========================================== -->

  <section
    id="loginScreen"
    class="login-container panel"
  >

    <h1 class="panel-title">
      わたしの本棚
    </h1>

    <!-- メールアドレス入力 -->

    <div id="emailStep">

      <p class="login-description">
        パスワードは不要です。<br>
        登録済みのメールアドレスにログイン用メールを送信します。
      </p>

      <form id="emailForm">

        <div class="form-group">

          <label for="loginEmail">
            メールアドレス
          </label>

          <input
            type="email"
            id="loginEmail"
            autocomplete="email"
            required
          >

        </div>

        <button
          type="submit"
          id="sendButton"
          class="primary-button login-button"
        >
          ログインメールを送る
        </button>

      </form>

    </div>


    <!-- OTPコード入力 -->

    <div
      id="otpStep"
      class="hidden"
    >

      <div class="login-step-title">
        メールを確認してください
      </div>

      <p class="login-hint">
        メールに認証コードが記載されている場合は、
        そのコードを入力してください。
        <br><br>
        マジックリンクが届いた場合は、
        メール内のリンクをクリックするだけでログインできます。
      </p>

      <form id="otpForm">

        <div class="form-group">

          <label for="otpCode">
            認証コード
          </label>

          <input
            type="text"
            id="otpCode"
            inputmode="numeric"
            autocomplete="one-time-code"
            placeholder="認証コード"
          >

        </div>

        <button
          type="submit"
          id="verifyButton"
          class="primary-button login-button"
        >
          認証コードでログイン
        </button>

      </form>

      <span
        id="resendButton"
        class="login-link"
      >
        メールを再送する
      </span>

      <br>

      <span
        id="changeEmailButton"
        class="login-link"
      >
        メールアドレスを変更
      </span>

    </div>

    <div
      id="loginMessage"
      class="message"
    ></div>

  </section>


  <!-- ==========================================
       アプリ本体
  =========================================== -->

  <main
    id="appScreen"
    class="container hidden"
  >

    <header class="app-header">

      <h1 class="app-title">
        わたしの本棚
      </h1>

      <p class="app-subtitle">
        読みたい本と、読んだ本をシンプルに記録
      </p>

    </header>


    <div class="header-actions">

      <div
        id="userInfo"
        class="user-info"
      ></div>

      <button
        id="logoutButton"
        class="logout-button"
      >
        ログアウト
      </button>

    </div>


    <div
      id="appMessage"
      class="message"
    ></div>


    <!-- 本登録 -->

    <section class="panel">

      <h2
        id="formTitle"
        class="panel-title"
      >
        本を登録
      </h2>

      <form id="bookForm">

        <input
          type="hidden"
          id="editId"
        >

        <div class="form-grid">

          <div class="form-group">

            <label for="title">
              本のタイトル
            </label>

            <input
              type="text"
              id="title"
              required
            >

          </div>


          <div class="form-group">

            <label for="status">
              種類
            </label>

            <select id="status">

              <option value="want">
                読みたい本
              </option>

              <option value="read">
                読んだ本
              </option>

            </select>

          </div>


          <div class="form-group">

            <label for="startDate">
              読書開始日
            </label>

            <input
              type="date"
              id="startDate"
            >

          </div>


          <div class="form-group">

            <label for="endDate">
              読書終了日
            </label>

            <input
              type="date"
              id="endDate"
            >

          </div>


          <div class="form-group full">

            <label for="note">
              備考・感想（100字以内）
            </label>

            <textarea
              id="note"
              maxlength="100"
            ></textarea>

            <div class="counter">
              <span id="noteCount">0</span>
              / 100文字
            </div>

          </div>

        </div>


        <div class="form-actions">

          <button
            type="submit"
            id="saveButton"
            class="primary-button"
          >
            本棚に追加
          </button>

          <button
            type="button"
            id="cancelEditButton"
            class="secondary-button"
          >
            編集をキャンセル
          </button>

        </div>

      </form>

    </section>


    <!-- 本棚 -->

    <section class="panel">

      <div class="tabs">

        <button
          class="tab-button active"
          data-tab="want"
        >
          読みたい本
        </button>

        <button
          class="tab-button"
          data-tab="read"
        >
          読んだ本
        </button>

      </div>


      <div class="summary">

        <div class="summary-card">

          <div class="summary-label">
            読みたい本
          </div>

          <div
            id="wantCount"
            class="summary-number"
          >
            0
          </div>

        </div>


        <div class="summary-card">

          <div class="summary-label">
            読んだ本
          </div>

          <div
            id="readCount"
            class="summary-number"
          >
            0
          </div>

        </div>

      </div>


      <div class="toolbar">

        <div
          id="tabDescription"
          class="tab-description"
        >
          これから読みたい本を表示しています。
        </div>

        <select
          id="yearFilter"
          class="year-filter hidden"
        >

          <option value="all">
            すべての年
          </option>

        </select>

      </div>


      <div class="bookshelf">

        <div
          id="bookList"
          class="book-grid"
        ></div>

      </div>

    </section>

  </main>


<script>

/* =========================================================
   Supabase設定
   ========================================================= */

/*
  ↓↓↓ 必ず自分の値に変更してください ↓↓↓
*/
  
    const SUPABASE_URL =
      "https://iivycgqxkxkwtjwstgpl.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_d8NnwWFU7eUlxpcL040qsg_SrCK2WWP";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================================
   状態
   ========================================================= */

let books = [];

let currentUser = null;

let currentTab = "want";

let loginEmailAddress = "";


/* =========================================================
   DOM
   ========================================================= */

const loginScreen =
  document.getElementById("loginScreen");

const appScreen =
  document.getElementById("appScreen");

const emailStep =
  document.getElementById("emailStep");

const otpStep =
  document.getElementById("otpStep");

const emailForm =
  document.getElementById("emailForm");

const otpForm =
  document.getElementById("otpForm");

const loginEmail =
  document.getElementById("loginEmail");

const otpCode =
  document.getElementById("otpCode");

const sendButton =
  document.getElementById("sendButton");

const verifyButton =
  document.getElementById("verifyButton");

const resendButton =
  document.getElementById("resendButton");

const changeEmailButton =
  document.getElementById("changeEmailButton");

const loginMessage =
  document.getElementById("loginMessage");

const logoutButton =
  document.getElementById("logoutButton");

const userInfo =
  document.getElementById("userInfo");

const bookForm =
  document.getElementById("bookForm");

const editIdInput =
  document.getElementById("editId");

const titleInput =
  document.getElementById("title");

const statusInput =
  document.getElementById("status");

const startDateInput =
  document.getElementById("startDate");

const endDateInput =
  document.getElementById("endDate");

const noteInput =
  document.getElementById("note");

const noteCount =
  document.getElementById("noteCount");

const saveButton =
  document.getElementById("saveButton");

const cancelEditButton =
  document.getElementById("cancelEditButton");

const formTitle =
  document.getElementById("formTitle");

const bookList =
  document.getElementById("bookList");

const wantCount =
  document.getElementById("wantCount");

const readCount =
  document.getElementById("readCount");

const yearFilter =
  document.getElementById("yearFilter");

const tabDescription =
  document.getElementById("tabDescription");

const tabButtons =
  document.querySelectorAll(".tab-button");

const appMessage =
  document.getElementById("appMessage");


/* =========================================================
   初期起動
   ========================================================= */

initializeApp();


async function initializeApp() {

  const {
    data: { session },
    error
  } =
    await supabaseClient.auth.getSession();


  if (error) {

    console.error(error);

    showLogin();

    return;

  }


  if (session?.user) {

    await startApp(session.user);

  } else {

    showLogin();

  }

}


/* =========================================================
   Auth状態変化
   Magic Linkから戻ってきた場合もここで検知
   ========================================================= */

supabaseClient.auth.onAuthStateChange(
  async (event, session) => {

    if (
      event === "SIGNED_IN" &&
      session?.user
    ) {

      await startApp(
        session.user
      );

    }


    if (
      event === "SIGNED_OUT"
    ) {

      showLogin();

    }

  }
);


/* =========================================================
   ログインメール送信
   ========================================================= */

emailForm.addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();

    loginEmailAddress =
      loginEmail.value.trim();

    if (!loginEmailAddress) {
      return;
    }

    await sendLoginEmail();

  }
);


async function sendLoginEmail() {

  clearLoginMessage();

  sendButton.disabled = true;

  sendButton.textContent =
    "送信中...";


  const {
    error
  } =
    await supabaseClient.auth
      .signInWithOtp({

        email:
          loginEmailAddress,

        options: {

          /*
            既存ユーザーのみログイン可能。

            存在しないメールアドレスで
            新規ユーザーを自動作成しない。
          */
          shouldCreateUser: false,

          /*
            Magic Linkの場合の
            ログイン後戻り先。

            GitHub Pagesで現在開いている
            index.htmlへ戻す。
          */
          emailRedirectTo:
            window.location.origin +
            window.location.pathname

        }

      });


  sendButton.disabled = false;

  sendButton.textContent =
    "ログインメールを送る";


  if (error) {

    console.error(error);

    showLoginMessage(
      "ログインメールを送信できませんでした。登録済みのメールアドレスか確認してください。",
      "error"
    );

    return;

  }


  emailStep.classList.add(
    "hidden"
  );

  otpStep.classList.remove(
    "hidden"
  );


  showLoginMessage(
    "ログインメールを送信しました。メールをご確認ください。",
    "success"
  );

}


/* =========================================================
   OTP認証
   ========================================================= */

otpForm.addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();


    const token =
      otpCode.value.trim();


    if (!token) {

      showLoginMessage(
        "認証コードを入力してください。",
        "error"
      );

      return;

    }


    verifyButton.disabled = true;

    verifyButton.textContent =
      "確認中...";


    const {
      data,
      error
    } =
      await supabaseClient.auth
        .verifyOtp({

          email:
            loginEmailAddress,

          token,

          type: "email"

        });


    verifyButton.disabled = false;

    verifyButton.textContent =
      "認証コードでログイン";


    if (error) {

      console.error(error);

      showLoginMessage(
        "認証コードが正しくないか、有効期限が切れています。",
        "error"
      );

      return;

    }


    if (data.user) {

      otpForm.reset();

      await startApp(
        data.user
      );

    }

  }
);


/* =========================================================
   再送
   ========================================================= */

resendButton.addEventListener(
  "click",
  async () => {

    await sendLoginEmail();

  }
);


/* =========================================================
   メールアドレス変更
   ========================================================= */

changeEmailButton.addEventListener(
  "click",
  () => {

    otpStep.classList.add(
      "hidden"
    );

    emailStep.classList.remove(
      "hidden"
    );

    otpForm.reset();

    clearLoginMessage();

  }
);


/* =========================================================
   ログアウト
   ========================================================= */

logoutButton.addEventListener(
  "click",
  async () => {

    const {
      error
    } =
      await supabaseClient.auth
        .signOut();


    if (error) {

      showAppMessage(
        "ログアウトに失敗しました。",
        "error"
      );

      return;

    }


    currentUser = null;

    books = [];

    resetForm();

    showLogin();

  }
);


/* =========================================================
   アプリ開始
   ========================================================= */

async function startApp(user) {

  currentUser = user;


  loginScreen.classList.add(
    "hidden"
  );

  appScreen.classList.remove(
    "hidden"
  );


  userInfo.textContent =
    user.email
      ? `ログイン中：${user.email}`
      : "ログイン中";


  await loadBooks();

}


function showLogin() {

  appScreen.classList.add(
    "hidden"
  );

  loginScreen.classList.remove(
    "hidden"
  );

}


/* =========================================================
   本一覧取得
   ========================================================= */

async function loadBooks() {

  showLoading();


  const {
    data,
    error
  } =
    await supabaseClient
      .from("books")
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(error);

    books = [];

    renderBooks();

    showAppMessage(
      "本棚の読み込みに失敗しました。",
      "error"
    );

    return;

  }


  books = data || [];


  updateSummary();

  updateYearFilter();

  updateTabs();

  updateTabUI();

  renderBooks();

}


/* =========================================================
   本の登録・更新
   ========================================================= */

bookForm.addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();


    if (!currentUser) {
      return;
    }


    const title =
      titleInput.value.trim();

    const status =
      statusInput.value;

    const startDate =
      startDateInput.value;

    const endDate =
      endDateInput.value;

    const note =
      noteInput.value.trim();

    const editId =
      editIdInput.value;


    if (!title) {

      showAppMessage(
        "本のタイトルを入力してください。",
        "error"
      );

      return;

    }


    if (note.length > 100) {

      showAppMessage(
        "感想は100文字以内で入力してください。",
        "error"
      );

      return;

    }


    if (
      startDate &&
      endDate &&
      startDate > endDate
    ) {

      showAppMessage(
        "終了日は開始日以降の日付にしてください。",
        "error"
      );

      return;

    }


    saveButton.disabled =
      true;


    if (editId) {

      await updateBook(
        editId,
        {
          title,

          status,

          start_date:
            startDate || null,

          end_date:
            endDate || null,

          note:
            note || null
        }
      );

    } else {

      await insertBook({

        user_id:
          currentUser.id,

        title,

        status,

        start_date:
          startDate || null,

        end_date:
          endDate || null,

        note:
          note || null

      });

    }


    saveButton.disabled =
      false;

  }
);


/* =========================================================
   INSERT
   ========================================================= */

async function insertBook(bookData) {

  const {
    error
  } =
    await supabaseClient
      .from("books")
      .insert(bookData);


  if (error) {

    console.error(error);

    showAppMessage(
      "本の登録に失敗しました。",
      "error"
    );

    return;

  }


  currentTab =
    bookData.status;


  resetForm();

  await loadBooks();


  showAppMessage(
    "本を登録しました。",
    "success"
  );

}


/* =========================================================
   UPDATE
   ========================================================= */

async function updateBook(
  id,
  bookData
) {

  const {
    error
  } =
    await supabaseClient
      .from("books")
      .update(bookData)
      .eq("id", id);


  if (error) {

    console.error(error);

    showAppMessage(
      "更新に失敗しました。",
      "error"
    );

    return;

  }


  currentTab =
    bookData.status;


  resetForm();

  await loadBooks();


  showAppMessage(
    "本を更新しました。",
    "success"
  );

}


/* =========================================================
   DELETE
   ========================================================= */

async function deleteBook(id) {

  const book =
    books.find(
      book =>
        String(book.id) ===
        String(id)
    );


  if (!book) {
    return;
  }


  if (
    !confirm(
      `「${book.title}」を削除しますか？`
    )
  ) {

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("books")
      .delete()
      .eq("id", id);


  if (error) {

    showAppMessage(
      "削除に失敗しました。",
      "error"
    );

    return;

  }


  await loadBooks();


  showAppMessage(
    "削除しました。",
    "success"
  );

}


/* =========================================================
   編集
   ========================================================= */

function editBook(id) {

  const book =
    books.find(
      book =>
        String(book.id) ===
        String(id)
    );


  if (!book) {
    return;
  }


  editIdInput.value =
    book.id;

  titleInput.value =
    book.title || "";

  statusInput.value =
    book.status || "want";

  startDateInput.value =
    book.start_date || "";

  endDateInput.value =
    book.end_date || "";

  noteInput.value =
    book.note || "";


  noteCount.textContent =
    noteInput.value.length;


  formTitle.textContent =
    "本を編集";


  saveButton.textContent =
    "変更を保存";


  cancelEditButton.style.display =
    "inline-block";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =========================================================
   フォーム
   ========================================================= */

noteInput.addEventListener(
  "input",
  () => {

    noteCount.textContent =
      noteInput.value.length;

  }
);


cancelEditButton.addEventListener(
  "click",
  resetForm
);


function resetForm() {

  bookForm.reset();

  editIdInput.value = "";

  noteCount.textContent =
    "0";

  formTitle.textContent =
    "本を登録";

  saveButton.textContent =
    "本棚に追加";

  cancelEditButton.style.display =
    "none";

}


/* =========================================================
   タブ
   ========================================================= */

tabButtons.forEach(
  button => {

    button.addEventListener(
      "click",
      () => {

        currentTab =
          button.dataset.tab;

        updateTabs();

        updateTabUI();

        renderBooks();

      }
    );

  }
);


function updateTabs() {

  tabButtons.forEach(
    button => {

      button.classList.toggle(
        "active",
        button.dataset.tab ===
          currentTab
      );

    }
  );

}


function updateTabUI() {

  if (
    currentTab === "want"
  ) {

    yearFilter.classList.add(
      "hidden"
    );

    tabDescription.textContent =
      "これから読みたい本を表示しています。";

  } else {

    yearFilter.classList.remove(
      "hidden"
    );

    tabDescription.textContent =
      "読んだ本を読了年ごとに確認できます。";

  }

}


/* =========================================================
   年フィルター
   ========================================================= */

yearFilter.addEventListener(
  "change",
  renderBooks
);


function updateYearFilter() {

  const selected =
    yearFilter.value;


  const years =
    [
      ...new Set(

        books

          .filter(
            book =>
              book.status ===
                "read" &&
              book.end_date
          )

          .map(
            book =>
              book.end_date
                .split("-")[0]
          )

      )
    ]
    .sort(
      (a,b) =>
        Number(b) -
        Number(a)
    );


  yearFilter.innerHTML =
    `
      <option value="all">
        すべての年
      </option>
    `;


  years.forEach(
    year => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        year;

      option.textContent =
        `${year}年`;

      yearFilter.appendChild(
        option
      );

    }
  );


  yearFilter.value =
    years.includes(selected)
      ? selected
      : "all";

}


/* =========================================================
   集計
   ========================================================= */

function updateSummary() {

  wantCount.textContent =
    books.filter(
      book =>
        book.status === "want"
    ).length;


  readCount.textContent =
    books.filter(
      book =>
        book.status === "read"
    ).length;

}


/* =========================================================
   本棚表示
   ========================================================= */

function renderBooks() {

  bookList.innerHTML = "";


  let filtered =
    books.filter(
      book =>
        book.status ===
        currentTab
    );


  if (
    currentTab === "read" &&
    yearFilter.value !== "all"
  ) {

    filtered =
      filtered.filter(
        book =>
          book.end_date &&
          book.end_date
            .startsWith(
              yearFilter.value
            )
      );

  }


  if (
    filtered.length === 0
  ) {

    bookList.innerHTML =
      `
        <div class="empty-state">
          本はまだ登録されていません。
        </div>
      `;

    return;

  }


  filtered.forEach(
    book => {

      const element =
        document.createElement(
          "article"
        );


      element.className =
        "book";


      element.innerHTML =
        `

          <div>

            <div class="book-title">
              ${escapeHtml(
                book.title
              )}
            </div>

            <div class="book-status-label">

              ${
                book.status === "want"
                  ? "読みたい本"
                  : "読んだ本"
              }

            </div>


            <div class="book-dates">

              ${
                book.start_date
                  ? `開始：${formatDate(
                      book.start_date
                    )}<br>`
                  : ""
              }

              ${
                book.end_date
                  ? `終了：${formatDate(
                      book.end_date
                    )}`
                  : ""
              }

            </div>


            ${
              book.note
                ?
                `
                  <div class="book-note">
                    ${escapeHtml(
                      book.note
                    )}
                  </div>
                `
                :
                ""
            }

          </div>


          <div class="book-actions">

            <button
              class="edit-button"
              data-edit="${book.id}"
            >
              編集
            </button>

            <button
              class="delete-button"
              data-delete="${book.id}"
            >
              削除
            </button>

          </div>

        `;


      bookList.appendChild(
        element
      );

    }
  );


  document
    .querySelectorAll(
      "[data-edit]"
    )
    .forEach(
      button => {

        button.onclick =
          () =>
            editBook(
              button.dataset.edit
            );

      }
    );


  document
    .querySelectorAll(
      "[data-delete]"
    )
    .forEach(
      button => {

        button.onclick =
          () =>
            deleteBook(
              button.dataset.delete
            );

      }
    );

}


function showLoading() {

  bookList.innerHTML =
    `
      <div class="loading-state">
        本棚を読み込んでいます...
      </div>
    `;

}


/* =========================================================
   メッセージ
   ========================================================= */

function showLoginMessage(
  message,
  type
) {

  loginMessage.textContent =
    message;

  loginMessage.className =
    `message ${type}`;

}


function clearLoginMessage() {

  loginMessage.textContent = "";

  loginMessage.className =
    "message";

}


function showAppMessage(
  message,
  type
) {

  appMessage.textContent =
    message;

  appMessage.className =
    `message ${type}`;

}


/* =========================================================
   その他
   ========================================================= */

function formatDate(date) {

  if (!date) {
    return "";
  }


  const [
    year,
    month,
    day
  ] =
    date.split("-");


  return `${year}/${month}/${day}`;

}


function escapeHtml(text) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text || "";


  return div.innerHTML;

}

</script>

</body>
</html>
